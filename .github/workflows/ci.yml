# CI existed here once and was removed (3d02d19), along with the two backlog
# items that only existed to serve it. That was a defensible call for a
# private repository with one author: the suite runs in about a minute
# locally, and a second machine agreeing with the first proved little.
#
# It stops being defensible the moment a second person can send a change.
# Nothing else in this repository can tell you whether a contribution passes
# on a machine that is not the author's, and the numbers the README cites --
# the test count, the 67.7% measured through the binary -- come from
# scripts/coverage.sh, which currently only ever runs when somebody
# remembers to run it. A claim nothing checks is a claim that drifts.
#
# Deliberately not here: no matrix over old Go versions (go.mod names one,
# and the toolchain directive means the one it names is the one that runs),
# no cross-compilation smoke test, no release automation. Those are worth
# adding when there is a release to automate.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Both, because keep's whole promise is one static binary with no cgo,
    # and the store is a file whose locking behaviour is the part most
    # likely to differ between platforms. Windows is deliberately absent:
    # it is not supported yet, and a red X for an unsupported platform
    # teaches people to ignore red Xs.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # CGO_ENABLED=0 is an assertion, not a setting. modernc.org/sqlite is
      # pure Go and the README's "0 cgo / one static file" claim depends on
      # it staying that way; a dependency that quietly needed cgo would
      # still build fine with the default and break the promise silently.
      - name: build (no cgo)
        env:
          CGO_ENABLED: 0
        run: go build ./...

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-clean:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # -count=1 defeats the test cache, which on a fresh runner would be
      # empty anyway, but says so out loud. The race detector needs cgo, so
      # it runs as its own step rather than making the no-cgo build above a
      # lie.
      - name: test
        run: go test ./... -count=1

      - name: test (race)
        run: go test ./... -count=1 -race

  coverage:
    # Separate job because it builds an instrumented binary and runs the
    # cross-process suite a second time. It is the only thing that can tell
    # you whether the README's coverage number is still true.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: coverage, in-process and through the binary
        run: scripts/coverage.sh

  demos:
    # The demo scripts are the exit gates the phases were built against, run
    # against a real installed binary. They assert behaviour the Go tests
    # deliberately do not reach into -- output shape, exit codes, what a
    # person actually sees.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: install keep
        run: go install ./cmd/keep
      - name: run the phase demos
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          for demo in scripts/demo-phase-*.sh; do
            echo "== $demo =="
            bash "$demo"
          done

  join:
    # The one test that proves keep and Interlock still agree. Neither
    # program imports the other -- that independence is the point, and it is
    # also why a renamed field on either side is invisible to both test
    # suites. TestInterlockJoinAgainstARealBinary builds a real Interlock,
    # takes a real lease through a real hook, and asserts keep's queue and
    # its claim verbs both react.
    #
    # It SKIPS when Interlock is not present, so keep still passes alone.
    # KEEP_REQUIRE_INTERLOCK turns that skip into a failure, which is what
    # this job is for: a skip nobody notices is the same blind spot in a new
    # place, and locally the skip is exactly what happens on a machine
    # without the checkout.
    #
    # Interlock is a private repository, so this needs a token. Without the
    # secret the job reports that it could not run rather than passing --
    # a green tick for a test that never executed is the failure mode this
    # whole job exists to remove.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: keep
      - name: check out interlock
        id: interlock
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: gshepptech/interlock
          path: interlock
          token: ${{ secrets.INTERLOCK_TOKEN }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: keep/go.mod
          cache: true
      - name: the join, with a skip treated as a failure
        if: steps.interlock.outcome == 'success'
        working-directory: keep
        env:
          KEEP_REQUIRE_INTERLOCK: "1"
          INTERLOCK_SRC: ${{ github.workspace }}/interlock
        run: go test ./cmd/keep/ -run Interlock -count=1 -v
      - name: report that the join could not be checked
        if: steps.interlock.outcome != 'success'
        run: |
          echo "::warning::INTERLOCK_TOKEN is not set, so the keep/Interlock join was NOT verified on this run." >&2
          echo "The join is the only thing that catches a renamed field on either side of a contract" >&2
          echo "that neither program's own test suite can see. Set the secret." >&2
          exit 1
